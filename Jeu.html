<body>
    <p>
        <canvas id="myCanvas" width="1800" height="1500"></canvas>
    </p>
    <p>
    Colonnes : <input type="text" id="nx" name="nx" size="3" value = 10 />
    Lignes : <input type="text" id="ny" name="ny" size="3" value = 10/>

    <button type="button" id="bouton">Nouvelle Partie</button>
    </p>
    <p>Utilisez S pour les solutions.</p>




    <script>
    "use strict";
// variante utilisant setInterval pour permettre l'affichage pendant la recherche

window.onload=(function(){

function Labyrinthe(canv,largeur,hauteur,nx,ny){

  this.dessinerMoia=function(x,y,couleurFond,couleurBord) {
    this.ctx.beginPath();
    this.ctx.rect(this.xTerrain(x)+2, this.yTerrain(y)+2, this.dx-4, this.dy-4);
    this.ctx.fillStyle = couleurFond;
    this.ctx.fill();
    this.ctx.lineWidth = 0;
    this.ctx.strokeStyle = couleurBord;
    this.ctx.stroke();

  } // dessinerMoia

  this.dessinerMoib=function(x,y) { // pour la recherche
    this.ctx.beginPath();
    this.ctx.rect(this.xTerrain(x)+3, this.yTerrain(y)+3, this.dx-5, this.dy-5);
    this.ctx.fillStyle = 'red';
    this.ctx.fill();
    this.ctx.lineWidth = 0;
    this.ctx.strokeStyle = 'red';
    this.ctx.stroke();

  } // dessinerMoib

  this.dessinerMoic=function(x,y) { // pour la recherche
    this.ctx.beginPath();
    this.ctx.rect(this.xTerrain(x)+3, this.yTerrain(y)+3, this.dx-5, this.dy-5);
    this.ctx.fillStyle = 'yellow';
    this.ctx.fill();
    this.ctx.lineWidth = 0;
    this.ctx.strokeStyle = 'yellow';
    this.ctx.stroke();

  } // dessinerMoib

  this.effacerMoi=function() {
    this.dessinerMoia(this.xMoi,this.yMoi,this.couleurFond,this.couleurFond);
  }

  this.dessinerMoi=function() {
    this.dessinerMoia(this.xMoi,this.yMoi,'#fff','#00');
  }

// calcule position x bord gauche de la case n
  this.xTerrain=function(n) {
    return this.X0+n*this.dx;
  }

// calcule position y bord sup de la case n
  this.yTerrain=function(n) {
    return this.Y0+n*this.dy;
  }

// fonctions pour casser murs entre 2 cases
  this.casserHaut=function(x,y) {
    this.terrain[x][y] &= ~1;
    this.terrain[x][y-1] &= ~4;
  } // this.casserHaut

  this.casserBas=function(x,y) {
    this.terrain[x][y] &= ~4;
    this.terrain[x][y+1] &= ~1;
  } // this.casserBas

  this.casserGauche=function(x,y) {
    this.terrain[x][y] &= ~2;
    this.terrain[x-1][y] &= ~8;
  } // this.casserGauche

  this.casserDroite=function(x,y) {
    this.terrain[x][y] &= ~8;
    this.terrain[x+1][y] &= ~2;
  } // this.casserGauche

// dessine terrain
  this.dessinerLabyrinthe=function() {
    var x,y;
    for (x=0;x<this.nx;x++) {
      for (y=0;y<this.ny;y++) {
        if ((this.terrain[x][y] & 1)!=0) {
          this.ctx.beginPath();
          this.ctx.lineWidth="1";
          this.ctx.strokeStyle="#000000";
          this.ctx.moveTo(this.xTerrain(x),this.yTerrain(y));
          this.ctx.lineTo(this.xTerrain(x+1),this.yTerrain(y));
          this.ctx.stroke();
        }
        if ((this.terrain[x][y] & 2) !=0) {
          this.ctx.beginPath();
          this.ctx.lineWidth="1";
          this.ctx.strokeStyle="#000000";
          this.ctx.moveTo(this.xTerrain(x),this.yTerrain(y));
          this.ctx.lineTo(this.xTerrain(x),this.yTerrain(y+1));
          this.ctx.stroke();
        }
      } // for y
    } // for x
  }
// initialise terrain
  this.creerLabyrinthe=function() {
    var tbDir=[1,2,4,8];
    // terrain vide
    var xc,yc;
    var rAv=this.nx*this.ny-1; // nombre de cases dans lesquelles il faut casser un mur
    var nvx=0, nvy=0,vois=0,dir;

    for (var kx=0 ;kx < this.nx ;kx++) {
      this.terrain[kx]=new Array(this.hauteur);
      for (var ky=0 ;ky < this.ny ;ky++) this.terrain[kx][ky]=15;
    } // for (var kx=0

// algorithme :
// on part d'une case au hasard
// on fait la liste de ses voisins qui ne font pas partie du labyrinthe
// si on en trouve, on en tire un au sort et on casse le mur qui les sépare
//   et ce voisin devient la nouvelle case de départ
// si on n'en trouve pas, on tire au sort une nouvelle case qui fait partie du labyrinthe
// part d'une case au hasard

    xc=Math.floor(Math.random()*this.nx);
    yc=Math.floor(Math.random()*this.ny);

//    rAv=15;
    while(rAv>0) {
      vois=0; // pas de voisin
      if (yc>0 && (this.terrain[xc][yc]&1)!=0 && this.terrain[xc][yc-1]==15) vois|=1; // possibilité casser en haut
      if (xc>0 && (this.terrain[xc][yc]&2)!=0 && this.terrain[xc-1][yc]==15) vois|=2; // possibilité casser à gauche
      if (yc<this.ny-1 && (this.terrain[xc][yc]&4)!=0 && this.terrain[xc][yc+1]==15) vois|=4; // possibilité casser en bas
      if (xc<this.nx-1 && (this.terrain[xc][yc]&8)!=0 && this.terrain[xc+1][yc]==15) vois|=8; // possibilité casser à droite
      if (vois != 0) {
        // choisir une direction au hasard parmi les possibles
        do {
          dir=tbDir[Math.floor(Math.random()*4)] & vois;
        } while (dir==0);
        switch(dir) {
          case 1 : this.casserHaut(xc,yc); yc-- ; break;
          case 2 : this.casserGauche(xc,yc); xc-- ; break;
          case 4 : this.casserBas(xc,yc); yc++ ; break;
          case 8 : this.casserDroite(xc,yc); xc++ ;  break;
        } // switch
        rAv--;
      } // si on peut trouver un voisin
      else { // essayer à partir d'une autre case
        do {
          xc=Math.floor(Math.random()*this.nx);
          yc=Math.floor(Math.random()*this.ny);
        } while (this.terrain[xc][yc]==15);
      }
    } // intégration des cases au labyrinthe
  }; // this.creerLabyrinthe

  this.demarrer = function(nx, ny) {
    this.ctx.clearRect(0, 0, this.canv.width, this.canv.height);
  // prise en compte du nombre de lignes et de colonnes
    this.nx = nx;  this.ny = ny;
    if (this.nx<3) this.nx=3; if (this.ny<3) this.ny=3;
    if (this.nx>111) this.nx=111; if (this.ny>80) this.ny=80;

  // pré-remplir formulaire
    document.getElementById("nx").value=this.nx;
    document.getElementById("ny").value=this.ny;

    this.dx=Math.floor((largeur-20)/this.nx);
    this.dy=Math.floor((hauteur-20)/this.ny);
    this.X0= Math.floor((this.largeur-this.nx*this.dx)/2)+0.5
    this.Y0= Math.floor((this.hauteur-this.ny*this.dy)/2)+0.5

    this.ctx.beginPath();
    this.ctx.lineWidth=1;
    this.ctx.strokeStyle="#000000";
    this.ctx.rect(this.X0,this.Y0,this.dx*this.nx,this.dy*this.ny);
    this.ctx.stroke();

    if (this.monTimer) {
      clearInterval (this.monTimer); // tue l'éventuelle recherche en cours
      delete this.monTimer;
    }

    this.terrain=new Array(this.largeur);

    this.ys=Math.floor(this.ny/2); // position de la sortie : mi-hauteur

    this.creerLabyrinthe();
    this.dessinerLabyrinthe();
  // dessine sortie
    this.ctx.beginPath();
    this.ctx.lineWidth=1;
    this.ctx.strokeStyle=this.couleurFond;
    this.ctx.moveTo(this.xTerrain(this.nx),this.yTerrain(this.ys));
    this.ctx.lineTo(this.xTerrain(this.nx),this.yTerrain(this.ys+1));
    this.ctx.stroke();

    this.xMoi=0; this.yMoi=this.ys;
    this.dessinerMoi();
    this.resolutionEnCours=false;
  } // demarrer
// fonction récursive de recherche
// modifiée pour être appelée à chaque top de setInterval
// sinon on ne voit pas la progression de la recherche

  this.poursuivreRecherche = function() {

    if (this.tbRech.length==0) { // on a fini la recherche
      this.tbRech=null;
      this.resolutionEnCours=false;
      this.dessinerMoi();
      clearInterval(this.monTimer);
      delete this.monTimer;
      return;
    }

    var rechCou=this.tbRech[this.tbRech.length-1];
    var etape=rechCou.etape;
    var vois=this.terrain[rechCou.x][rechCou.y];
    if (this.tbRech.length==1)
      parent={x:-2,y:-2}; //parent bidon pour le début de recherche
    else
      parent=this.tbRech[this.tbRech.length-2];

    if (etape==0) { // début recherche à ce niveau
      this.dessinerMoib(rechCou.x,rechCou.y); // matérialiser la position étudiée
      if (rechCou.x==this.nx-1 && rechCou.y==this.ys) { // on a trouvé
        // on l'indique au parent
        if (this.tbRech.length>1) this.tbRech[this.tbRech.length-2].succes=true;
        this.tbRech.pop(); // on efface pour arrêter recherche à ce niveau
        this.dessinerMoic(rechCou.x,rechCou.y); // redessiner en jaune
        return;
      }

      this.tbRech[this.tbRech.length-1].etape++;
      if (((vois & 8) ==0)  && (parent.x!=(rechCou.x+1))) {
        this.tbRech.push({x:rechCou.x+1,y:rechCou.y,etape:0,succes:false});
        return;
      } else etape++;
    } // si étape 0

    if (rechCou.succes) { // on vient d'essayer d'un côté, on teste
      // on l'indique au parent
      if (this.tbRech.length>1) this.tbRech[this.tbRech.length-2].succes=true;
      this.tbRech.pop(); // on efface pour arrêter recherche à ce niveau
      this.dessinerMoic(rechCou.x,rechCou.y); // matérialiser la position étudiée
      return; // on n'efface pas le rectange dessiné en entrant
    }

  // pas de ce côté-ci, on essaye autre

    if (etape==1) {
      this.tbRech[this.tbRech.length-1].etape++;
      if (((vois & 1) ==0)  && (parent.y!=(rechCou.y-1))) {
        this.tbRech.push({x:rechCou.x,y:rechCou.y-1,etape:0,succes:false});
        return;
      } else etape++;
    } // si étape 1
    if (etape==2) {
    // pas de ce côté ci, on essaye autre
      this.tbRech[this.tbRech.length-1].etape++;
      if (((vois & 4) ==0)  && (parent.y!=(rechCou.y+1))) {
        this.tbRech.push({x:rechCou.x,y:rechCou.y+1,etape:0,succes:false});
        return;
      } else etape++;
    }
    if (etape==3) {
      this.tbRech[this.tbRech.length-1].etape++;
      if (((vois & 2) ==0)  && (parent.x!=(rechCou.x-1))) {
        this.tbRech.push({x:rechCou.x-1,y:rechCou.y,etape:0,succes:false});
        return;
      } else etape++
    }
    // échec complet, on efface et on depile
    this.tbRech.pop(); // on efface pour arrêter recherche à ce niveau
    this.dessinerMoia(rechCou.x,rechCou.y,this.couleurFond,this.couleurFond);
  } // this.poursuivreRecherche;

  this.initierRecherche=function() {
    this.tbRech=[{x:this.xMoi,y:this.yMoi,etape:0,succes:false}];
    this.monTimer=setInterval((function(lab){ return function(){lab.poursuivreRecherche();}})(this),3);
  };

  this.canv=canv;
  this.hauteur=hauteur;
  this.largeur=largeur;
  this.couleurFond='#745084';
  this.canv.width=largeur;
  this.canv.height=hauteur;
  this.styleDessin="#884400";
  this.ctx=this.canv.getContext("2d");
  this.demarrer(nx, ny);

  (function (obj) {

    document.onkeydown = function (keyStroke)
    {
    if (keyStroke.defaultPrevented) return; // déjà traité
    if (obj.resolutionEnCours) return; // ignorer pendant résolution
    var x=keyStroke;
    var y=5;
    var bouge=0;

//      if (x.keyIdentifier) y=x.keyIdentifier;
      y=x.key;
      switch (y) {
        case 'ArrowUp' : if ((obj.terrain[obj.xMoi][obj.yMoi] & 1)==0) {
                     obj.effacerMoi();obj.yMoi--;obj.dessinerMoi();
                     bouge=1;
          }
          break;
        case 'ArrowLeft' : if ((obj.terrain[obj.xMoi][obj.yMoi] & 2)==0) {
                     obj.effacerMoi();obj.xMoi--;obj.dessinerMoi();
                     bouge=1;
          }
          break;
        case 'ArrowDown' : if ((obj.terrain[obj.xMoi][obj.yMoi] & 4)==0) {
                     obj.effacerMoi();obj.yMoi++;obj.dessinerMoi();
                     bouge=1;
          }
          break;
        case 'ArrowRight' : if ((obj.terrain[obj.xMoi][obj.yMoi] & 8)==0) {
                     obj.effacerMoi();obj.xMoi++;obj.dessinerMoi();
                     bouge=1;
          }
          break;

        case 's':;
        case 'S':;
        case 'U+0053':;
        case 'U+0073':
                       obj.resolutionEnCours=true;
                       obj.initierRecherche();
                       obj.dessinerMoi();
          break;
        default : return; // évite le 'preventDefault' si touche pas pour nous
      } // switch (y)
      keyStroke.preventDefault();
      if (bouge==1 && obj.xMoi==obj.nx-1 && obj.yMoi==obj.ys) {
        setTimeout(function(){alert ('Bien joue ! tu as gagne !')},100);
      }
    };
   })(this);

} // Labyrinthe

  let bouton = document.getElementById('bouton');
  bouton.addEventListener('click', function() {
    let nnx = document.getElementById('nx').value;
    let nny = document.getElementById('ny').value;
    nnx = window.parseInt(nnx);
    nny = window.parseInt(nny);
    labyr.demarrer(nnx,nny);
  });

  let labyr = new Labyrinthe(document.getElementById("myCanvas"),1900,900,10,8);
}) ;
</script>
</body>
